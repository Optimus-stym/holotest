// ---------- Text texture helpers ----------
function makeTextPlane(scene, name, opts) {
  // opts: {texW, texH, height(m)}
  const tex = new BABYLON.DynamicTexture(name + 'Tex', { width: opts.texW, height: opts.texH }, scene, true);
  tex.hasAlpha = true;
  const mat = new BABYLON.StandardMaterial(name + 'Mat', scene);
  mat.diffuseTexture = tex;            // supplies the transparency
  mat.useAlphaFromDiffuseTexture = true;
  mat.emissiveTexture = tex;           // supplies the color, unaffected by lighting
  mat.diffuseColor = BABYLON.Color3.Black();
  mat.specularColor = BABYLON.Color3.Black();
  mat.disableLighting = true;
  mat.backFaceCulling = false;
  const mesh = BABYLON.MeshBuilder.CreatePlane(name, { width: 1, height: 1 }, scene);
  mesh.material = mat;
  return { mesh, tex, mat };
}

  const W = label.tex.getSize().width, H = label.tex.getSize().height;
  ctx.clearRect(0, 0, W, H);
  ctx.font = 'bold 66px system-ui, sans-serif';
  const tw = Math.min(W - 20, ctx.measureText(label.text).width);
  // soft dark backing so text reads against a bright room (dark = see-through on HoloLens, so it stays subtle)
  ctx.fillStyle = 'rgba(0,0,0,0.55)';

  ctx.fillStyle = color;

  ctx.fillText(label.text, W / 2, H / 2 + 3, W - 20);
  label.tex.update();
  label.color = color;

  const aspect = (tw + 40) / H;
  label.baseSX = label.h * aspect;
  label.baseSY = label.h;
  const b = label.curBoost || 1;
  label.mesh.scaling.x = label.baseSX * b;
  label.mesh.scaling.y = label.baseSY * b;
  label.mesh.setPivotPoint(BABYLON.Vector3.Zero());

  label.tex.uScale = (tw + 40) / W;
  label.tex.uOffset = (1 - label.tex.uScale) / 2;

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);

}

function wrapText(ctx, text, maxW) {
  const words = text.split(' '); const lines = []; let line = '';

    if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; } else line = test;

  if (line) lines.push(line);

}

// ---------- Scene ----------

    // the headset only lets a page start mixed reality right after a tap, so nothing else may come first
    const slow = setTimeout(() => { statusEl.textContent = 'Still waiting for the headset to start mixed reality… (if this never changes, tell Claude)'; }, 8000);
    const modes = mode === 'immersive-ar' ? ['immersive-ar', 'immersive-vr'] : [mode];
    const spaces = ['local-floor', 'local', 'unbounded'];
    let lastErr = null;
    // Ask for finger tracking first; if the headset refuses, try again without it.
    for (const dropHands of [false, true]) {
      const opts = dropHands ? {} : { optionalFeatures: ['hand-tracking'] };
      for (const m of modes) for (const space of spaces) {
        try {
          statusEl.textContent = 'Starting mixed reality (' + m + ', ' + space + (dropHands ? ', no finger tracking' : '') + ')…';
          if (SAFE_MODE && SCALE_TEST) await xr.baseExperience.enterXRAsync(m, space, xr.renderTarget);
          else if (SAFE_MODE) await xr.baseExperience.enterXRAsync(m, space);
          else await xr.baseExperience.enterXRAsync(m, space, xr.renderTarget, opts);
          clearTimeout(slow); starting = false; startBtn.textContent = '▶ START (tap here)';
          statusEl.textContent = 'Running (' + m + ', ' + space + (dropHands ? ', no hand tracking' : '') + ')';
          return;
        } catch (e) { lastErr = e; console.warn('enterXR failed for', m, space, e); }
      }
    }
    clearTimeout(slow); starting = false; startBtn.textContent = '▶ START (tap here)';
    statusEl.textContent = 'Could not start mixed reality: ' + ((lastErr && lastErr.name) || '') + ' ' + ((lastErr && lastErr.message) || lastErr) + '. Send this message to Claude.';
  });

  let frames = 0;
  xr.baseExperience.onStateChangedObservable.add(state => {
    if (state === BABYLON.WebXRState.IN_XR) { scene.clearColor = new BABYLON.Color4(0, 0, 0, 0); frames = 0; }
    if (state === BABYLON.WebXRState.NOT_IN_XR) { scene.clearColor = previewBg; world.position.set(0, 0, 0); world.rotation.y = 0; }
  });
  xr.baseExperience.sessionManager.onXRFrameObservable.add(() => {
    applyCalToEyes(xr.baseExperience.camera);
    frames++;
    if (frames === 10) recenter();   // wait a few frames so the head position is known
  });
  return scene;
}

createScene().then(scene => {
  engine.runRenderLoop(() => scene.render());
  window.__scene = scene;
}).catch(err => {
  statusEl.textContent = 'Something went wrong: ' + err.message;
  console.error(err);
});
window.addEventListener('resize', () => engine.resize());
</script>
</body>
</html>
