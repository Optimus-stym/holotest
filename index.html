// ---------- Text texture helpers ----------
function makeTextPlane(scene, name, opts) {
  // opts: {texW, texH, height(m)}
  const tex = new BABYLON.DynamicTexture(name + 'Tex', { width: opts.texW, height: opts.texH }, scene, true);
  tex.hasAlpha = true;
  const mat = new BABYLON.StandardMaterial(name + 'Mat', scene);
  mat.diffuseTexture = tex;            // supplies the transparency
  mat.useAlphaFromDiffuseTexture = true;
  mat.emissiveTexture = tex;           // supplies the color, unaffected by lighting
  mat.diffuseColor = BABYLON.Color3.Black();
  mat.specularColor = BABYLON.Color3.Black();
  mat.disableLighting = true;
  mat.backFaceCulling = false;
  const mesh = BABYLON.MeshBuilder.CreatePlane(name, { width: 1, height: 1 }, scene);
  mesh.material = mat;
  return { mesh, tex, mat };
}

function drawWord(label, color) {
  const ctx = label.tex.getContext();
  const W = label.tex.getSize().width, H = label.tex.getSize().height;
  ctx.clearRect(0, 0, W, H);
  ctx.font = 'bold 66px system-ui, sans-serif';
  const tw = Math.min(W - 20, ctx.measureText(label.text).width);
  // soft dark backing so text reads against a bright room (dark = see-through on HoloLens, so it stays subtle)
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  roundRect(ctx, (W - tw) / 2 - 14, 6, tw + 28, H - 12, 18); ctx.fill();
  ctx.fillStyle = color;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(label.text, W / 2, H / 2 + 3, W - 20);
  label.tex.update();
  label.color = color;
  // size the plane to the text width
  const aspect = (tw + 40) / H;
  label.baseSX = label.h * aspect;
  label.baseSY = label.h;
  const b = label.curBoost || 1;
  label.mesh.scaling.x = label.baseSX * b;
  label.mesh.scaling.y = label.baseSY * b;
  label.mesh.setPivotPoint(BABYLON.Vector3.Zero());
  // crop the texture horizontally so plane width matches visible text
  label.tex.uScale = (tw + 40) / W;
  label.tex.uOffset = (1 - label.tex.uScale) / 2;
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

function wrapText(ctx, text, maxW) {
  const words = text.split(' '); const lines = []; let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; } else line = test;
  }
  if (line) lines.push(line);
  return lines;
}

// ---------- Scene ----------
async function createScene() {
  const scene = new BABYLON.Scene(engine);
  const previewBg = new BABYLON.Color4(0.05, 0.055, 0.075, 1);
  scene.clearColor = previewBg;

  const cam = new BABYLON.FreeCamera('cam', new BABYLON.Vector3(0, EYE, -0.35), scene);
  cam.setTarget(new BABYLON.Vector3(0, EYE - 0.5, 2));
  cam.attachControl(canvas, true);
  cam.minZ = 0.02; cam.speed = 0.06; cam.angularSensibility = 3000; cam.fov = 1.15;
  cam.keysUp.push(87); cam.keysDown.push(83); cam.keysLeft.push(65); cam.keysRight.push(68);
  new BABYLON.HemisphericLight('sky', new BABYLON.Vector3(0, 1, 0), scene).intensity = 1;

  // Everything hangs off "world", which gets placed in front of the viewer.
  const world = new BABYLON.TransformNode('world', scene);

  // ----- Word labels -----
  const words = DATA.words.map((d, i) => {
    const tp = makeTextPlane(scene, 'w_' + d.w, { texW: 512, texH: 96 });
    const L = { ...d, ...tp, text: d.w, h: 0.095, alpha: 1, targetAlpha: 1, color: null, curBoost: 1, targetBoost: 1 };
    tp.mesh.parent = world;
    tp.mesh.billboardMode = BABYLON.Mesh.BILLBOARDMODE_ALL;
    tp.mesh.metadata = { kind: 'word', ref: L };
    L.target = new BABYLON.Vector3();
    drawWord(L, CAT_COLORS[d.c]);
    return L;
  });
  const byWord = Object.fromEntries(words.map(w => [w.w, w]));

  // Extra labels for operators, wall headers, etc.
  function extraLabel(text, color, h) {
    const tp = makeTextPlane(scene, 'x_' + text, { texW: 1024, texH: 96 });
    const L = { ...tp, text, h: h || 0.07, alpha: 0, targetAlpha: 0, curBoost: 1, targetBoost: 1, target: new BABYLON.Vector3(0, EYE, 2) };
    tp.mesh.parent = world; tp.mesh.billboardMode = BABYLON.Mesh.BILLBOARDMODE_ALL; tp.mesh.isPickable = false;
    drawWord(L, color);
    tp.mesh.position.copyFrom(L.target);
    return L;
  }
  const ops = { minus: extraLabel('−', '#ffffff', 0.09), plus: extraLabel('+', '#ffffff', 0.09), eq: extraLabel('≈', '#ffffff', 0.09) };
    const hdrHe = extraLabel('← leans "he"', HE_COLOR, 0.07);
  const hdrShe = extraLabel('leans "she" →', SHE_COLOR, 0.07);
  const hdrJobs = extraLabel('JOBS', '#cfd3dc', 0.05);
  const hdrTraits = extraLabel('DESCRIBING WORDS', '#cfd3dc', 0.05);
  const hdrNeutral = extraLabel('every job now measures 0.00', '#ffffff', 0.06);
  const extras = [ops.minus, ops.plus, ops.eq, hdrHe, hdrShe, hdrJobs, hdrTraits, hdrNeutral];

  // Center line for the wall
  const centerLine = BABYLON.MeshBuilder.CreateBox('centerLine', { width: 0.006, height: 1.25, depth: 0.006 }, scene);
  centerLine.parent = world; centerLine.position.set(0, 1.45, 2.52); centerLine.isPickable = false;
  const clMat = new BABYLON.StandardMaterial('clMat', scene); clMat.disableLighting = true; clMat.emissiveColor = new BABYLON.Color3(0.8, 0.8, 0.8);
  centerLine.material = clMat; clMat.alpha = 0; let centerLineTarget = 0;

  const lineMat = new BABYLON.StandardMaterial('lineMat', scene);
  lineMat.disableLighting = true; lineMat.emissiveColor = new BABYLON.Color3(0.56, 0.83, 1); lineMat.alpha = 0.85;

  // Info tag that appears above a tapped word
  const tag = makeTextPlane(scene, 'tag', { texW: 2048, texH: 96 });
  const tagL = { ...tag, text: '', h: 0.075 };
  tag.mesh.parent = world; tag.mesh.billboardMode = BABYLON.Mesh.BILLBOARDMODE_ALL; tag.mesh.isPickable = false; tag.mesh.setEnabled(false);
  let lines = null, selected = null, focusSet = null;

  // ----- Layouts -----
  // Map fills a 15 ft x 15 ft floor area (about 4.5 m), from knee height to just above head height.
  const MAP_C = new BABYLON.Vector3(0, 1.4, 3.45), MAP_S = new BABYLON.Vector3(2.2, 0.8, 2.2);
  function layoutMap() {
    for (const w of words) {
      w.target.set(MAP_C.x + w.p[0] * MAP_S.x, MAP_C.y + w.p[1] * MAP_S.y, MAP_C.z + w.p[2] * MAP_S.z);
      w.targetAlpha = 1; w.wantColor = CAT_COLORS[w.c];
    }
  }

  function layoutEq(a, b, c, start) {
    const result = DATA.analogies[start][0];
    const row = [byWord[a], ops.minus, byWord[b], ops.plus, byWord[c], ops.eq, byWord[result]];
    const gap = 0.05, y = 1.68, z = 1.9;
    const widths = row.map(r => r.baseSX);
    let x = -(widths.reduce((s, v) => s + v, 0) + gap * (row.length - 1)) / 2;
    for (const w of words) { w.targetAlpha = 0.12; w.wantColor = CAT_COLORS[w.c]; }
    row.forEach((r, i) => {
      r.target.set(x + widths[i] / 2, y, z); x += widths[i] + gap;
      r.targetAlpha = 1;
    });
    byWord[result].wantColor = '#ffffff';
    // the rest of the map stays where it is, faded
    for (const w of words) if (!row.includes(w)) {
      w.target.set(MAP_C.x + w.p[0] * MAP_S.x, MAP_C.y + w.p[1] * MAP_S.y, MAP_C.z + w.p[2] * MAP_S.z);
    }
    ops.minus.targetAlpha = ops.plus.targetAlpha = ops.eq.targetAlpha = 1;
  }

  // Pack labels into rows along x without overlapping
  function packRows(list, xOf, yTop, rowH, z) {
    const sorted = [...list].sort((a, b) => xOf(a) - xOf(b));
    const rowEnds = [];
    for (const w of sorted) {
      const half = w.baseSX / 2 + 0.01;
      const x = xOf(w);
      let r = rowEnds.findIndex(end => x - half > end);
      if (r < 0) { r = rowEnds.length; rowEnds.push(-Infinity); }
      rowEnds[r] = x + half;
      w.target.set(x, yTop - r * rowH, z + (r % 2) * 0.02);
    }
    return rowEnds.length;
  }

  const WALL_X = 1.0 / 0.38; // score of ±0.38 maps to ±1.0 m (fits the HoloLens field of view at 2.5 m)
  function layoutWall() {
    const jobs = words.filter(w => w.c === 'jobs'), traits = words.filter(w => w.c === 'traits');
    for (const w of words) { w.targetAlpha = 0; w.wantColor = CAT_COLORS[w.c]; }
    const nRows = packRows(jobs, w => w.g * WALL_X, 1.95, 0.08, 2.5);
    packRows(traits, w => w.g * WALL_X, 1.95 - nRows * 0.08 - 0.16, 0.08, 2.5);
    for (const w of [...jobs, ...traits]) { w.targetAlpha = 1; w.wantColor = leanColor(w.g); }
    hdrHe.target.set(-0.8, 2.12, 2.5); hdrShe.target.set(0.8, 2.12, 2.5);
    hdrJobs.target.set(0, 2.12, 2.5);
    hdrTraits.target.set(0, 1.95 - nRows * 0.08 - 0.06, 2.5);
    hdrHe.targetAlpha = hdrShe.targetAlpha = hdrJobs.targetAlpha = hdrTraits.targetAlpha = 1;
    centerLineTarget = 0.5;
  }

  function layoutNeutral() {
    const jobs = words.filter(w => w.c === 'jobs').sort((a, b) => a.w.localeCompare(b.w));
    for (const w of words) { w.targetAlpha = 0; }
    const cols = 4, colW = 0.4;
    jobs.forEach((w, i) => {
      const col = i % cols, row = Math.floor(i / cols);
      w.target.set((col - (cols - 1) / 2) * colW, 1.95 - row * 0.08, 2.5);
      w.targetAlpha = 1; w.wantColor = NEUTRAL_COLOR;
    });
    hdrNeutral.target.set(0, 2.12, 2.5); hdrNeutral.targetAlpha = 1;
    centerLineTarget = 0.5;
  }

  function layoutAfter() {
    const jobs = words.filter(w => w.c === 'jobs');
    for (const w of words) { w.targetAlpha = 0; }
    // start from the computed 2D layout, then nudge apart any labels that overlap
    const pts = jobs.map(w => ({ w, x: w.q[0] * 0.95, y: 1.55 + w.q[1] * 0.42, hw: w.baseSX / 2 + 0.012, hh: 0.04 }));
    for (let it = 0; it < 80; it++) {
      let moved = false;
      for (let i = 0; i < pts.length; i++) for (let j = i + 1; j < pts.length; j++) {
        const A = pts[i], B = pts[j];
        const ox = A.hw + B.hw - Math.abs(A.x - B.x), oy = A.hh + B.hh - Math.abs(A.y - B.y);
        if (ox > 0 && oy > 0) {
          moved = true;
          if (oy < ox) { const d = (oy / 2 + 0.001) * (A.y >= B.y ? 1 : -1); A.y += d; B.y -= d; }
          else { const d = (ox / 2 + 0.001) * (A.x >= B.x ? 1 : -1); A.x += d; B.x -= d; }
        }
      }
      if (!moved) break;
    }
    pts.forEach((P, i) => {
      P.w.target.set(P.x, P.y, 2.5 + (i % 3) * 0.01);
      P.w.targetAlpha = 1; P.w.wantColor = leanColor(P.w.g);
    });
  }

  // ----- Panel (narration + buttons) -----
  const panelRoot = new BABYLON.TransformNode('panelRoot', scene);
  panelRoot.parent = world;
  // Panel sits low and centered: glance down to read, look up to see the words.
  // About 4 ft away: closer than that, HoloLens images are hard for the eyes to merge.
  panelRoot.position.set(0, EYE - 0.55, 1.2);
  panelRoot.rotation.x = 0.4;
  panelRoot.scaling.setAll(1.33);   // bigger, so it reads the same size at the new distance

  const panel = makeTextPlane(scene, 'panel', { texW: 1024, texH: 700 });
  panel.mesh.parent = panelRoot; panel.mesh.scaling.set(0.56, 0.56 * 700 / 1024, 1); panel.mesh.isPickable = false;

  function drawPanel(i) {
    const s = STEPS[i], ctx = panel.tex.getContext();
    ctx.clearRect(0, 0, 1024, 700);
    ctx.fillStyle = 'rgba(10,14,24,0.88)'; roundRect(ctx, 4, 4, 1016, 692, 36); ctx.fill();
    ctx.strokeStyle = 'rgba(140,200,255,0.9)'; ctx.lineWidth = 5; roundRect(ctx, 4, 4, 1016, 692, 36); ctx.stroke();
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = '#8fd3ff'; ctx.font = 'bold 30px system-ui, sans-serif';
    ctx.fillText(`STEP ${i + 1} OF ${STEPS.length}`, 50, 70);
    ctx.fillStyle = '#ffffff'; ctx.font = 'bold 58px system-ui, sans-serif';
    ctx.fillText(s.title, 50, 140);
    ctx.font = '34px system-ui, sans-serif'; ctx.fillStyle = '#e8ecf3';
    let size = 34;
    if (wrapText(ctx, s.body, 924).length > 11) { size = 30; ctx.font = size + 'px system-ui, sans-serif'; }
    const L2 = wrapText(ctx, s.body, 924);
    L2.forEach((ln, k) => ctx.fillText(ln, 50, 200 + k * size * 1.32));
    ctx.font = 'italic 27px system-ui, sans-serif'; ctx.fillStyle = '#aab4c3';
    ctx.fillText(s.foot, 50, 665);
    panel.tex.update();
  }

  function makeButton(text, x, onPress, w, y) {
    const tp = makeTextPlane(scene, 'btn_' + text, { texW: 512, texH: 128 });
    const B = { ...tp, text, hover: false };
    tp.mesh.parent = panelRoot;
    const bw = w || 0.17;
    tp.mesh.scaling.set(bw, bw * 128 / 512, 1);
    tp.mesh.position.set(x, y === undefined ? -0.255 : y, -0.005);
    tp.mesh.metadata = { kind: 'button', press: onPress, btn: B };
    B.draw = (label, lit) => {
      const ctx = tp.tex.getContext(); ctx.clearRect(0, 0, 512, 128);
      ctx.fillStyle = lit ? 'rgba(80,170,255,0.95)' : 'rgba(30,60,110,0.92)'; roundRect(ctx, 6, 6, 500, 116, 40); ctx.fill();
      ctx.strokeStyle = '#8fd3ff'; ctx.lineWidth = 5; roundRect(ctx, 6, 6, 500, 116, 40); ctx.stroke();
      ctx.fillStyle = '#ffffff'; ctx.font = 'bold 50px system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(label, 256, 68); tp.tex.update(); B.labelNow = label;
    };
    B.draw(text, false);
    return B;
  }

  let step = 0;
  const backBtn = makeButton('◀  Back', -0.19, () => go(step - 1));
  const nextBtn = makeButton('Next  ▶', 0.19, () => go(step + 1));
  const centerBtn = makeButton('Recenter', 0, () => recenter(), 0.15);
  const closeBtn = makeButton('✕  Close', 0.205, () => closeApp(), 0.15, -0.325);
  const alignBtn = makeButton('Align lenses', -0.205, () => startCal(), 0.15, -0.325);
  const storyButtons = [backBtn, nextBtn, centerBtn, closeBtn, alignBtn];

  // ----- Lens alignment (calibration) -----
  // Everything for alignment is fixed in the room: a "stand here" circle on the floor,
  // green targets straight ahead at eye height, and the controls arranged around the
  // targets so you can press them without looking away.
  let cal = loadCal(), calibrating = false, calSavedMsg = '';
  const calRig = new BABYLON.TransformNode('calRig', scene); calRig.parent = world; calRig.setEnabled(false);
  const CTRL_Z = 1.3;   // controls float about 4 ft away

  // info card above the targets
  const calInfo = makeTextPlane(scene, 'calInfo', { texW: 1024, texH: 300 });
  calInfo.mesh.parent = calRig; calInfo.mesh.isPickable = false;
  calInfo.mesh.scaling.set(0.64, 0.64 * 300 / 1024, 1); calInfo.mesh.position.set(0, 0.25, CTRL_Z);

  const calButtons = [];
  function calBtn(text, x, y, fn) {
    const B = makeButton(text, 0, fn, 0.18);
    B.mesh.parent = calRig; B.mesh.position.set(x, y, CTRL_Z); B.mesh.renderingGroupId = 1;
    calButtons.push(B); return B;
  }
  const bump = (key, d) => () => { cal[key] += d; calSavedMsg = ''; drawCalPanel(); };
  calBtn('Up ▲', 0, 0.12, bump('v', 1));
  calBtn('▼ Down', 0, -0.12, bump('v', -1));
  calBtn('◀ Left', -0.3, 0, bump('h', -1));
  calBtn('Right ▶', 0.3, 0, bump('h', 1));
  calBtn('− Depth', -0.3, -0.12, bump('s', -1));
  calBtn('Depth +', 0.3, -0.12, bump('s', 1));
  calBtn('Reset', -0.22, -0.23, () => { cal = { ...DEFAULT_CAL }; calSavedMsg = ''; drawCalPanel(); });
  calBtn('Save', 0, -0.23, () => saveCal());
  calBtn('Done', 0.22, -0.23, () => endCal());

  function drawCalPanel() {
    const ctx = calInfo.tex.getContext();
    ctx.clearRect(0, 0, 1024, 300);
    ctx.fillStyle = 'rgba(10,14,24,0.88)'; roundRect(ctx, 4, 4, 1016, 292, 30); ctx.fill();
    ctx.strokeStyle = 'rgba(140,200,255,0.9)'; ctx.lineWidth = 5; roundRect(ctx, 4, 4, 1016, 292, 30); ctx.stroke();
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = '#ffffff'; ctx.font = 'bold 40px system-ui, sans-serif';
    ctx.fillText('Stand on the circle. Look straight ahead.', 512, 70);
    ctx.font = '30px system-ui, sans-serif'; ctx.fillStyle = '#e8ecf3';
    ctx.fillText('Use the arrows until the middle green target is single.', 512, 122);
    ctx.fillText('Then use Depth until the near and far targets are single too.', 512, 162);
    ctx.font = 'bold 34px system-ui, sans-serif'; ctx.fillStyle = '#8fd3ff';
    const f = v => (v > 0 ? '+' : '') + v;
    ctx.fillText('Side ' + f(cal.h) + '    Up/down ' + f(cal.v) + '    Depth ' + f(cal.s), 512, 220);
    ctx.font = 'italic 28px system-ui, sans-serif'; ctx.fillStyle = '#aab4c3';
    ctx.fillText(calSavedMsg || ('Calibration code: ' + calCode(cal)), 512, 268);
    calInfo.tex.update();
  }

  function saveCal() {
    try { localStorage.setItem('mapOfMeaningCal', JSON.stringify(cal)); } catch (e) {}
    try { const u = new URL(location.href); u.searchParams.set('cal', calCode(cal)); history.replaceState(null, '', u); } catch (e) {}
    calSavedMsg = 'Saved on this headset. Code: ' + calCode(cal);
    statusEl.textContent = 'Saved lens alignment. Calibration code: ' + calCode(cal);
    console.log('Map of Meaning calibration code:', calCode(cal));
    drawCalPanel();
  }

  // green targets straight ahead at eye height: about 4 ft, 8 ft and 15 ft away
  const calMat = new BABYLON.StandardMaterial('calMat', scene); calMat.disableLighting = true; calMat.emissiveColor = new BABYLON.Color3(0.3, 1, 0.45);
  for (const d of [1.3, 2.5, 4.5]) {
    const sz = 0.05 * d, th = 0.004 * d;
    const node = new BABYLON.TransformNode('t' + d, scene); node.parent = calRig; node.position.set(0, 0, d);
    const hBar = BABYLON.MeshBuilder.CreateBox('th', { width: sz * 2.2, height: th, depth: th }, scene);
    const vBar = BABYLON.MeshBuilder.CreateBox('tv', { width: th, height: sz * 2.2, depth: th }, scene);
    const ring = BABYLON.MeshBuilder.CreateTorus('tr', { diameter: sz * 1.4, thickness: th, tessellation: 48 }, scene);
    ring.rotation.x = Math.PI / 2;
    for (const m of [hBar, vBar, ring]) { m.parent = node; m.material = calMat; m.isPickable = false; }
  }

  // "stand here" circle on the floor, with an arrow pointing toward the targets
  const floorMark = new BABYLON.TransformNode('floorMark', scene); floorMark.parent = calRig;
  const markMat = new BABYLON.StandardMaterial('markMat', scene); markMat.disableLighting = true; markMat.emissiveColor = new BABYLON.Color3(1, 0.85, 0.3);
  const footRing = BABYLON.MeshBuilder.CreateTorus('footRing', { diameter: 0.6, thickness: 0.02, tessellation: 64 }, scene);
  footRing.parent = floorMark; footRing.material = markMat; footRing.isPickable = false;
  const arrow = BABYLON.MeshBuilder.CreateCylinder('arrow', { height: 0.18, diameterTop: 0, diameterBottom: 0.14, tessellation: 3 }, scene);
  arrow.parent = floorMark; arrow.material = markMat; arrow.isPickable = false;
  arrow.rotation.x = Math.PI / 2; arrow.position.set(0, 0.01, 0.45);
  const standLbl = makeTextPlane(scene, 'standLbl', { texW: 512, texH: 96 });
  standLbl.mesh.parent = floorMark; standLbl.mesh.isPickable = false;
  standLbl.mesh.scaling.set(0.4, 0.075, 1); standLbl.mesh.rotation.x = Math.PI / 2; standLbl.mesh.position.set(0, 0.01, -0.42);
  { const c = standLbl.tex.getContext(); c.clearRect(0, 0, 512, 96); c.fillStyle = '#ffd94d'; c.font = 'bold 60px system-ui, sans-serif';
    c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('STAND HERE', 256, 52); standLbl.tex.update(); }

  function startCal() {
    calibrating = true; calSavedMsg = ''; clearSelection();
    // fix everything in the room where you are standing now, facing where you look
    const c = activeCam(), inv = invWorld();
    const h = BABYLON.Vector3.TransformCoordinates(c.position, inv);
    const f = BABYLON.Vector3.TransformNormal(c.getDirection(BABYLON.Axis.Z), inv); f.y = 0;
    if (f.lengthSquared() < 1e-4) f.set(0, 0, 1); f.normalize();
    calRig.position.copyFrom(h); calRig.rotation.y = Math.atan2(f.x, f.z);
    floorMark.position.set(0, -Math.max(0.5, h.y) + 0.01, 0);   // world y = 0 is the floor
    panelRoot.setEnabled(false);
    calRig.setEnabled(true);
    drawCalPanel();
  }
  function endCal() {
    calibrating = false; calRig.setEnabled(false);
    panelRoot.setEnabled(true); panelFollowing = true;   // panel comes back to you
    go(step);
  }

  // Apply the alignment to each eye every frame, right after Babylon reads the headset's eye positions.
  function applyCalToEyes(xrCam) {
    if (!cal.h && !cal.v && !cal.s) return;
    const rigs = xrCam.rigCameras;
    if (rigs.length < 2) return;
    const L = rigs.find(r => r.isLeftCamera) || rigs[0], R = rigs.find(r => r.isRightCamera) || rigs[1];
    const across = R.position.subtract(L.position);
    if (across.lengthSquared() > 1e-8 && cal.s) {
      across.normalize().scaleInPlace(cal.s * 0.0005);   // half a millimeter per eye per step
      L.position.subtractInPlace(across); R.position.addInPlace(across);
    }
    for (const [cam, sign] of [[L, -1], [R, 1]]) {
      const dx = sign * cal.h * CAL_H_STEP / 2, dy = sign * cal.v * CAL_V_STEP / 2;
      if (!dx && !dy) continue;
      const m = cam._projectionMatrix.m, a = Array.from(m);
      for (let i = 0; i < 4; i++) { a[i * 4 + 0] += dx * a[i * 4 + 3]; a[i * 4 + 1] += dy * a[i * 4 + 3]; }
      BABYLON.Matrix.FromArrayToRef(a, 0, cam._projectionMatrix);
    }
  }
  function closeApp() {
    if (xr && xr.baseExperience.state === BABYLON.WebXRState.IN_XR) xr.baseExperience.exitXRAsync();
    else statusEl.textContent = 'Close works inside the headset. Here in preview, just close the browser tab.';
  }

  function flash(B, label) { B.draw(label, true); setTimeout(() => B.draw(label, false), 180); }

  function go(i) {
    if (i < 0) return;
    if (i >= STEPS.length) i = 0;
    step = i; clearSelection();
    for (const e of extras) e.targetAlpha = 0;
    centerLineTarget = 0;
    const s = STEPS[i];
    if (s.layout === 'map') layoutMap();
    else if (s.layout === 'eq') layoutEq(s.eq[0], s.eq[1], s.eq[2], s.eq[3]);
    else if (s.layout === 'wall') layoutWall();
    else if (s.layout === 'neutral') layoutNeutral();
    else if (s.layout === 'after') layoutAfter();
    drawPanel(i);
    backBtn.draw(i === 0 ? ' ' : '◀  Back', false);
    nextBtn.draw(i === STEPS.length - 1 ? 'Start over' : 'Next  ▶', false);
  }

  // ----- Tap a word: show neighbors / score -----
  function clearSelection() {
    if (lines) { lines.dispose(); lines = null; }
    tag.mesh.setEnabled(false);
    if (selected) { drawWord(selected, selected.wantColor); selected = null; }
    focusSet = null;
    for (const w of words) w.targetBoost = 1;
  }

  function select(w) {
    if (w.targetAlpha < 0.5) return;
    const was = selected; clearSelection();
    if (was === w) return;
    selected = w;
    const layout = STEPS[step].layout;
    const useAfter = layout === 'after';
    const nnList = (useAfter ? w.nn2 : w.nn) || [];
    const shown = nnList.map(n => byWord[n]).filter(n => n && n.alpha > 0.5);
    let msg;
    if (layout === 'wall' || layout === 'neutral') {
      const g = layout === 'neutral' ? 0 : w.g;
      msg = `${w.w}: ${g === 0 ? 'neutral (0.00)' : (g > 0 ? 'leans "she" ' : 'leans "he" ') + (g > 0 ? '+' : '') + g.toFixed(2)}`;
    } else {
      msg = `closest: ${nnList.join(', ')}`;
    }
    drawWord(w, '#ffffff');
    w.targetBoost = 1.9;
    focusSet = new Set([w]);
    if (layout !== 'wall' && layout !== 'neutral') for (const n of shown) { n.targetBoost = 1.35; focusSet.add(n); }
    tagL.text = msg; drawWord(tagL, '#8fd3ff');
    tag.mesh.setEnabled(true);
    if (shown.length && layout !== 'wall' && layout !== 'neutral') {
      lines = { meshes: shown.map(n => {
        const tube = BABYLON.MeshBuilder.CreateCylinder('nn', { height: 1, diameter: 0.008, tessellation: 6 }, scene);
        tube.parent = world; tube.isPickable = false; tube.material = lineMat;
        return { tube, n };
      }), dispose() { this.meshes.forEach(m => m.tube.dispose()); } };
    }
  }

  // ----- Input -----
  let lastPress = 0;
  scene.onPointerObservable.add(pi => {
    if (pi.type !== BABYLON.PointerEventTypes.POINTERDOWN) return;
    const pick = pi.pickInfo;
    if (!pick || !pick.hit || !pick.pickedMesh || !pick.pickedMesh.metadata) return;
    const now = performance.now(); if (now - lastPress < 300) return; lastPress = now;
    const md = pick.pickedMesh.metadata;
    if (md.kind === 'button') {
      if (md.btn && md.btn.labelNow && md.btn.labelNow.trim()) flash(md.btn, md.btn.labelNow);
      md.press();
    } else if (md.kind === 'word') select(md.ref);
  });
  window.addEventListener('keydown', e => {
    if (calibrating) return;
    if (e.key === 'ArrowRight' || e.key === 'n') go(step + 1);
    if (e.key === 'ArrowLeft' || e.key === 'b') go(step - 1);
  });

  // ----- Animation: glide toward targets -----
  const all = [...words, ...extras];
  for (const w of words) { w.wantColor = CAT_COLORS[w.c]; }
  go(0);
  for (const w of all) { w.mesh.position.copyFrom(w.target); w.alpha = w.targetAlpha; }
  scene.onBeforeRenderObservable.add(() => {
    const dt = Math.min(0.1, engine.getDeltaTime() / 1000), k = 1 - Math.exp(-dt * 3.2);
    // a selected word floats toward you a little so it stands out in depth
    const head = activeCam().position;
    for (const w of all) {
      let tgt = w.target;
      if (w === selected) {
        const wp = BABYLON.Vector3.TransformCoordinates(w.target, world.getWorldMatrix());
        const toHead = head.subtract(wp); const d = toHead.length();
        if (d > 1.4) { const localPull = BABYLON.Vector3.TransformNormal(toHead.scale(Math.min(0.35, d - 1.4) / d), invWorld()); tgt = w.target.add(localPull); }
      }
      BABYLON.Vector3.LerpToRef(w.mesh.position, tgt, k, w.mesh.position);
      let ta = w.targetAlpha;
      if (focusSet && !focusSet.has(w)) ta = Math.min(ta, 0.22);
      if (calibrating) ta = 0;
      w.alpha += (ta - w.alpha) * k;
      w.mat.alpha = w.alpha;
      w.mesh.isVisible = w.alpha > 0.02;
      w.mesh.isPickable = w.mesh.metadata ? (w.targetAlpha > 0.5 && !calibrating) : false;
      w.curBoost += ((w.targetBoost || 1) - w.curBoost) * k * 1.5;
      if (w.baseSX) { w.mesh.scaling.x = w.baseSX * w.curBoost; w.mesh.scaling.y = w.baseSY * w.curBoost; }
      if (w.wantColor && w.color !== w.wantColor && w !== selected) drawWord(w, w.wantColor);
    }
    if (selected) {
      tag.mesh.position.copyFrom(selected.mesh.position).addInPlace(new BABYLON.Vector3(0, selected.baseSY * selected.curBoost * 0.5 + 0.07, 0));
      if (lines) for (const m of lines.meshes) {
        const a = selected.mesh.position, b = m.n.mesh.position;
        const d = b.subtract(a), len = d.length();
        m.tube.position.copyFrom(a).addInPlace(d.scale(0.5));
        m.tube.scaling.set(1, len, 1);
        const up = new BABYLON.Vector3(0, 1, 0), dir = d.scale(1 / Math.max(len, 1e-4));
        const axis = BABYLON.Vector3.Cross(up, dir); const ang = Math.acos(Math.max(-1, Math.min(1, BABYLON.Vector3.Dot(up, dir))));
        m.tube.rotationQuaternion = axis.lengthSquared() < 1e-8 ? BABYLON.Quaternion.Identity() : BABYLON.Quaternion.RotationAxis(axis.normalize(), ang);
      }
    }
    followPanel(k);
    clMat.alpha += ((calibrating ? 0 : centerLineTarget) - clMat.alpha) * k;
    centerLine.isVisible = clMat.alpha > 0.02;
  });

  // ----- Placement in front of the viewer -----
  let xr = null;
  function activeCam() { return (xr && xr.baseExperience.state === BABYLON.WebXRState.IN_XR) ? xr.baseExperience.camera : cam; }
  function invWorld() { return world.getWorldMatrix().clone().invert(); }

  // The panel lazily follows you as you walk through the 15 ft area, so it is always nearby.
  const PANEL_DIST = 1.2, PANEL_DROP = 0.55;
  let panelFollowing = false;
  function followPanel(k) {
    if (calibrating || !(xr && xr.baseExperience.state === BABYLON.WebXRState.IN_XR)) return;
    const c = activeCam(), inv = invWorld();
    const h = BABYLON.Vector3.TransformCoordinates(c.position, inv);
    const f = BABYLON.Vector3.TransformNormal(c.getDirection(BABYLON.Axis.Z), inv); f.y = 0;
    if (f.lengthSquared() < 1e-4) return; f.normalize();
    const want = new BABYLON.Vector3(h.x + f.x * PANEL_DIST, h.y - PANEL_DROP, h.z + f.z * PANEL_DIST);
    const wantYaw = Math.atan2(f.x, f.z);
    let dy = wantYaw - panelRoot.rotation.y; dy = Math.atan2(Math.sin(dy), Math.cos(dy));
    const off = BABYLON.Vector3.Distance(want, panelRoot.position);
    if (!panelFollowing && (off > 0.7 || Math.abs(dy) > 0.75)) panelFollowing = true;
    if (panelFollowing) {
      BABYLON.Vector3.LerpToRef(panelRoot.position, want, k * 0.8, panelRoot.position);
      panelRoot.rotation.y += dy * k * 0.8;
      if (off < 0.05 && Math.abs(dy) < 0.05) panelFollowing = false;
    }
  }
  function recenter() {
    const c = (xr && xr.baseExperience.state === BABYLON.WebXRState.IN_XR) ? xr.baseExperience.camera : cam;
    const fwd = c.getDirection(BABYLON.Axis.Z); fwd.y = 0;
    if (fwd.lengthSquared() < 1e-4) fwd.set(0, 0, 1);
    fwd.normalize();
    world.position.set(c.position.x, c.position.y - EYE, c.position.z);
    world.rotation.y = Math.atan2(fwd.x, fwd.z);
    panelRoot.position.set(0, EYE - PANEL_DROP, PANEL_DIST); panelRoot.rotation.y = 0; panelFollowing = false;
  }

  // ----- Mixed reality -----
  let mode = null;
  try {
    if (navigator.xr) {
      if (await BABYLON.WebXRSessionManager.IsSessionSupportedAsync('immersive-ar')) mode = 'immersive-ar';
      else if (await BABYLON.WebXRSessionManager.IsSessionSupportedAsync('immersive-vr')) mode = 'immersive-vr';
    }
  } catch (e) { mode = null; }   // a sandboxed preview may block mixed reality entirely
  if (!mode) {
    statusEl.textContent = 'Preview mode (no mixed reality on this device). Use the panel buttons or the arrow keys to move through the story.';
    return scene;
  }
  xr = await scene.createDefaultXRExperienceAsync({
    uiOptions: { sessionMode: mode, referenceSpaceType: 'local-floor' },
    disableTeleportation: true
  });
  try {
    // last argument false = optional, so headsets without this exact feature can still start
    xr.baseExperience.featuresManager.enableFeature(BABYLON.WebXRFeatureName.HAND_TRACKING, 'latest', { xrInput: xr.input }, true, false);
  } catch (e) { console.warn('Hand tracking not available:', e); }

  // ----- Joke pointer (testing only, see FUN_POINTER at the top) -----
  if (FUN_POINTER && xr.pointerSelection) {
    xr.pointerSelection.displayLaserPointer = false;   // hide the normal ray, keep the tap cursor
    const skin = new BABYLON.StandardMaterial('funSkin', scene);
    skin.diffuseColor = new BABYLON.Color3(0.96, 0.74, 0.62);
    skin.emissiveColor = new BABYLON.Color3(0.55, 0.38, 0.3);   // glow a bit, dark shows as see-through on HoloLens
    skin.specularColor = new BABYLON.Color3(0.15, 0.15, 0.15);
    const tipMat = new BABYLON.StandardMaterial('funTip', scene);
    tipMat.diffuseColor = new BABYLON.Color3(0.95, 0.55, 0.55); tipMat.emissiveColor = new BABYLON.Color3(0.55, 0.28, 0.3);
    function makeFunPointer() {
      const root = new BABYLON.TransformNode('funPointer', scene);
      const shaft = BABYLON.MeshBuilder.CreateCylinder('funShaft', { height: 0.19, diameter: 0.036, tessellation: 20 }, scene);
      shaft.rotation.x = Math.PI / 2; shaft.position.z = 0.105;
      const tip = BABYLON.MeshBuilder.CreateSphere('funTip', { diameter: 0.042, segments: 12 }, scene);
      tip.scaling.z = 1.25; tip.position.z = 0.205; tip.material = tipMat;
      const ballL = BABYLON.MeshBuilder.CreateSphere('funBallL', { diameter: 0.046, segments: 12 }, scene);
      const ballR = ballL.clone('funBallR');
      ballL.position.set(-0.022, -0.006, 0.012); ballR.position.set(0.022, -0.006, 0.012);
      for (const m of [shaft, ballL, ballR]) m.material = skin;
      for (const m of [shaft, tip, ballL, ballR]) { m.parent = root; m.isPickable = false; }
      return root;
    }
    const funPointers = new Map();
    xr.input.onControllerAddedObservable.add(c => funPointers.set(c.uniqueId, { c, node: makeFunPointer() }));
    xr.input.onControllerRemovedObservable.add(c => { const f = funPointers.get(c.uniqueId); if (f) { f.node.dispose(); funPointers.delete(c.uniqueId); } });
    const funRay = new BABYLON.Ray(BABYLON.Vector3.Zero(), BABYLON.Vector3.Forward(), 1);
    scene.onBeforeRenderObservable.add(() => {
      for (const { c, node } of funPointers.values()) {
        if (!c.pointer) { node.setEnabled(false); continue; }
        c.getWorldPointerRayToRef(funRay);
        node.setEnabled(!calibrating);
        node.position.copyFrom(funRay.origin).addInPlace(funRay.direction.scale(0.03));
        node.lookAt(funRay.origin.add(funRay.direction));
      }
    });
  }
  statusEl.textContent = 'Mixed reality ready. Air-tap the big START button below.' + (calCode(cal) !== '0,0,0' ? ' (Lens alignment ' + calCode(cal) + ')' : '');
  const startBtn = document.getElementById('startBtn');
  startBtn.style.display = 'block';
  startBtn.addEventListener('click', async () => {
    statusEl.textContent = 'Starting…';
    const modes = mode === 'immersive-ar' ? ['immersive-ar', 'immersive-vr'] : [mode];
    const spaces = ['local-floor', 'local', 'unbounded'];
    let lastErr = null;
    // Try the plain setup first; if the headset refuses, drop hand tracking and try again.
    for (const dropHands of [false, true]) {
      if (dropHands) { try { xr.baseExperience.featuresManager.disableFeature(BABYLON.WebXRFeatureName.HAND_TRACKING); } catch (e) {} }
      for (const m of modes) for (const space of spaces) {
        try {
          await xr.baseExperience.enterXRAsync(m, space);
          statusEl.textContent = 'Running (' + m + ', ' + space + (dropHands ? ', no hand tracking' : '') + ')';
          return;
        } catch (e) { lastErr = e; console.warn('enterXR failed for', m, space, e); }
      }
    }
    statusEl.textContent = 'Could not start mixed reality: ' + ((lastErr && lastErr.message) || lastErr) + '. Send this message to Claude.';
  });

  let frames = 0;
  xr.baseExperience.onStateChangedObservable.add(state => {
    if (state === BABYLON.WebXRState.IN_XR) { scene.clearColor = new BABYLON.Color4(0, 0, 0, 0); frames = 0; }
    if (state === BABYLON.WebXRState.NOT_IN_XR) { scene.clearColor = previewBg; world.position.set(0, 0, 0); world.rotation.y = 0; }
  });
  xr.baseExperience.sessionManager.onXRFrameObservable.add(() => {
    applyCalToEyes(xr.baseExperience.camera);
    frames++;
    if (frames === 10) recenter();   // wait a few frames so the head position is known
  });
  return scene;
}

createScene().then(scene => {
  engine.runRenderLoop(() => scene.render());
  window.__scene = scene;
}).catch(err => {
  statusEl.textContent = 'Something went wrong: ' + err.message;
  console.error(err);
});
window.addEventListener('resize', () => engine.resize());
</script>
</body>
</html>
